<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRMM · Workspace</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style>
:root{color-scheme:dark;--bg:#0b101a;--panel:#151e2c;--line:#2a384c;--muted:#a1b2c8;--blue:#99bdff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:20px 5vw}header strong{font-size:20px}header a{color:var(--blue)}header #identity{margin-left:auto;color:var(--muted)}main{max-width:1180px;margin:auto;padding:30px 24px}h1{margin-top:0;font-size:32px}h2{font-size:20px}p{line-height:1.5}.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.card{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:inherit;background:#0e1725}button{cursor:pointer}button:hover,nav button.active{border-color:var(--blue);background:#253a58}button.primary{background:#315ba4}input,select,textarea{width:100%;margin-top:6px}label{display:block;color:var(--muted);margin:14px 0}label.check{display:flex;align-items:center;gap:8px}label.check input{width:auto;margin:0}textarea{min-height:100px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}small{color:var(--muted)}.hidden{display:none!important}#notice{white-space:pre-wrap;padding:16px;border-radius:10px;background:#182b43;margin:16px 0;overflow-wrap:anywhere}.error{background:#48232d!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.messages{max-height:360px;overflow:auto}.message{padding:14px;background:#0d1623;border-radius:10px;margin-bottom:8px;white-space:pre-wrap}.badge{font-size:12px;padding:3px 7px;background:#263c54;border-radius:6px}.mono{font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere}#login{max-width:420px;margin:40px auto}a{color:var(--blue)}.scroll{overflow-x:auto}dialog{color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:650px;width:90vw}dialog::backdrop{background:#000a}footer{color:var(--muted);font-size:13px;margin-top:30px}
header .pulse-brand{width:190px;height:auto;max-width:42vw;object-fit:contain}@media(max-width:640px){body{padding-bottom:env(safe-area-inset-bottom)}header{padding:14px 14px;gap:10px;flex-wrap:wrap}header .pulse-brand{width:155px;max-width:48vw}header #identity{margin-left:auto}main{padding:20px 12px}.grid{grid-template-columns:minmax(0,1fr);gap:12px}.card{padding:16px;border-radius:13px}button{min-height:42px}table{display:block;max-width:100%;overflow-x:auto;white-space:nowrap}dialog{max-height:88dvh;overflow:auto}nav{gap:6px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}</style></head><body><header><img class="pulse-brand" src="/pulse-logo.png" width="1200" height="400" alt="PulseRMM"><a href="/">Fleet console</a><a href="/support.html">My support</a><span id="identity"></span><button id="signout" class="hidden">Sign out</button></header><main><div id="notice" class="hidden" role="status"></div><section id="login" class="card"><h1>Welcome back</h1><p class="muted">Sign in to your Pulse workspace.</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label>Authenticator or recovery code<input name="otp" autocomplete="one-time-code" placeholder="If two-factor authentication is enabled"></label><button class="primary">Sign in</button></form></section><div id="workspace" class="hidden"><h1 id="heading">Workspace</h1><p id="intro" class="muted"></p><nav id="nav"></nav><section id="content"></section><footer>PulseRMM · Self-hosted device support · Changes are permission-checked and audited.</footer></div></main><dialog id="modal"><div id="modalBody"></div><p><button onclick="document.getElementById('modal').close()">Close</button></p></dialog><script src="/manage.js" defer></script></body></html>
